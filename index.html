:root{--bg:#f3f4f6;--card:#fff;--ink:#17212b;--muted:#687582;--line:#e2e7eb;--brand:#2563eb;--brand2:#1d4ed8;--nav:#111b27}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}aside{background:var(--nav);color:#e5edf5;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{font-size:19px;font-weight:800;color:white;padding:0 8px}.brand small{display:block;color:#9aabba;font-size:12px;font-weight:500;margin-top:3px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#d2dce5;text-align:left;padding:11px 12px;border-radius:9px;font-weight:600;cursor:pointer}nav button:hover,nav button.active{background:#26384c;color:#fff}.aside-note{margin-top:auto;color:#94a3b1;font-size:12px;padding:8px}main{padding:28px;min-width:0;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}.top h1{margin:0;font-size:29px}.top .right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}.muted,.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}.btn:hover{background:#f8fafc}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.primary:hover{background:var(--brand2)}.btn.danger{color:#b91c1c;border-color:#fecaca}.btn.danger:hover{background:#fef2f2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}.kpi label{color:var(--muted);text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.4px}.kpi strong{display:block;font-size:26px;margin:5px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi span{font-size:13px;color:var(--muted)}.section{margin-bottom:16px}.section h2,.card h2{font-size:18px;margin:0 0 14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:200px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;letter-spacing:.45px;text-transform:uppercase;color:var(--muted);background:#f8fafc}td small{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;border-radius:99px;background:#e8eef7;color:#33506d;padding:3px 8px;font-size:12px;font-weight:700}.badge.low{background:#fff1d6;color:#a16207}.badge.out{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#166534}tr.returned td{color:#9aa5b1}tr.returned td b{text-decoration:line-through}.actions{display:flex;gap:6px}.actions .btn{padding:6px 9px;font-size:12px}.empty{padding:20px;text-align:center;color:var(--muted)}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}.summary-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.total{font-size:22px;font-weight:800;padding-top:12px}.stack{display:grid;gap:10px;margin-top:14px}.file-btn{display:block;text-align:center}.sr-only{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.card p{margin:0 0 6px}.modal .lead{margin:-8px 0 14px;color:var(--muted)}.modal-actions{flex-wrap:wrap}.modal-bg{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff function refresh(){

    +field('Alış fiyatı (₺)','cost',v.cost||'','Kaça aldınız?','text',numAttrs)
    +field('Satış fiyatı (₺)','price',v.price||'','İsteğe bağlı, satarken de girilebilir','text',numAttrs)

  const form=el('deviceForm');let busy=false;

    if(!g('brand')||!g('model')){toast('Marka ve model zorunlu.');return}
    const imei=g('imei').replace(/\s/g,'');

    if(fresh&&imei&&active().some(s=>s.imei===imei)&&!await ask('Bu IMEI daha önce satılmış görünüyor. Telefonu geri aldıysanız devam edin.',{ok:'Kaydet'}))return;
    const item={brand:g('brand'),model:g('model'),storage:g('storage'),color:g('color'),imei,cost:n('cost'),price:n('price')};
    if(!item.cost&&!await ask('Alış fiyatı girilmedi, kâr yanlış hesaplanır. Yine de kaydedilsin mi?',{ok:'Kaydet'}))return;
    if(item.price&&item.price<item.cost&&!await ask('Satış fiyatı alış fiyatından düşük. Yine de kaydedilsin mi?',{ok:'Kaydet'}))return;
    busy=true;
    const rec=fresh?{id:uid(),...item,addedAt:nowIso()}:{...x,...item};
    if(fresh&&again){openDevice(null,{...item,imei:''});setTimeout(()=>{const i=document.querySelector('#deviceForm [name=imei]');if(i)i.focus()},60)}
    else closeModal();
    if(await store.putDevice(rec)){
      if(fresh&&again){const same=data.devices.filter(d=>low(nm(d)+d.storage+d.color)===low(nm(item)+item.storage+item.color)).length;toast('Eklendi. Bu modelden stokta '+same+' adet var. Sıradakinin IMEI’sini girin.')}
      else toast(fresh?'Telefon eklendi':'Telefon güncellendi');
    }
    busy=false;
  };

async function readImei(file){
  const st=el('ocrStatus'),input=document.querySelector('#deviceForm [name=imei]');if(!st||!input)return;
  st.textContent='Görsel okunuyor… (ilk seferde biraz sürebilir)';
  try{
    await loadTesseract();
    const r=await Tesseract.recognize(file,'eng'),f=findImei(r.data.text);
    if(!el('ocrStatus'))return;
    if(f.valid){input.value=f.valid;st.textContent='IMEI bulundu ve doğrulandı: '+f.valid}
    else if(f.any){input.value=f.any;st.textContent='15 haneli numara bulundu ama doğrulanamadı, lütfen kontrol edin: '+f.any}
    else st.textContent='15 haneli IMEI bulunamadı. Görseli yakınlaştırıp tekrar deneyin.';
  }catch{const s=el('ocrStatus');if(s)s.textContent='Görsel okunamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.'}
}
function openSell(x){
  showModal('<div class="modal-bg"><form class="modal" id="sellForm" novalidate><h2>Sattık: '+esc(nm(x))+'</h2><p class="lead">'+esc([x.storage,x.color,x.imei&&('IMEI '+x.imei)].filter(Boolean).join(' · ')||'—')+'</p>'

  form.onsubmit=async e=>{

    const price=money(E.price.value),imei=x.imei||(E.imei?E.imei.value.replace(/\s/g,''):'');
    const customer=E.customer.value.trim(),phone=E.phone.value.trim(),payment=E.payment.value;
    if(price<=0){toast('Satış fiyatını girin.');return}
    if(payment==='Veresiye'&&!customer&&!phone){toast('Veresiye satışta müşteri adı veya telefonu girin.');return}

    if(imei&&active().some(s=>s.imei===imei)&&!await ask('Bu IMEI ile daha önce satış yapılmış. Yine de kaydedilsin mi?',{ok:'Kaydet'}))return;
    if(price<x.cost&&!await ask('Satış fiyatı alış fiyatının ('+fmt(x.cost)+') altında. Zararına satış kaydedilsin mi?',{ok:'Kaydet',danger:true}))return;
    busy=true;

    closeModal();
    if(await store.putSale(s)){await store.delDevice(x.id);toast('Satıldı: '+nm(x)+' · '+fmt(price)+' (kâr '+fmt(price-x.cost)+')')}
    busy=false;
  };
}

/* ---------- Dosya indirme (iPhone'da paylaşım menüsü) ---------- */
const stamp=()=>nowIso().slice(0,10);
async function download(name,content,type){
  const blob=new Blob([content],{type});
  if(isIOS&&navigator.canShare&&window.File){
    try{const file=new File([blob],name,{type});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
    catch(err){if(err&&err.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
function csvText(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',txt=v=>v?q('="'+v+'"'):'""';
  const head=['Tarih','Müşteri','Telefon','Cihaz','Hafıza','Renk','IMEI','Adet','Satış fiyatı','Alış','Tutar','Kâr','Ödeme','Tahsil','Durum'];
  const body=data.sales.map(s=>[q(new Date(s.date).toLocaleString('tr-TR')),q(s.customer),txt(s.phone),q(s.name),q(s.storage),q(s.color),txt(s.imei),s.qty||1,s.price,s.cost||0,s.total,s.status==='iade'?0:profit(s),q(s.payment),q(s.paid?'Evet':'Hayır'),q(s.status==='iade'?'İade':'Satış')].join(';'));
  return '﻿'+[head.map(q).join(';'),...body].join('\r\n');
}

/* ---------- Giriş / veri yükleme ---------- */
async function loadMembers(){const {data:rows,error}=await sb.from('members').select('email').order('added_at');if(!error){members=rows||[];if(page==='ayar')refresh()}}
async function loadAll(){
  const [d,s]=await Promise.all([sb.from('devices').select('*').limit(10000),sb.from('sales').select('*').order('date',{ascending:false}).limit(10000)]);
  if(d.error||s.error)throw d.error||s.error;
  data.devices=d.data.map(devFromRow);data.sales=s.data.map(saleFromRow);sortDevs();sortSales();
}
function live(){
  if(channel){sb.removeChannel(channel);channel=null}
  channel=sb.channel('dukkan')
    .on('postgres_changes',{event:'*',schema:'public',table:'devices'},p=>{
      if(p.eventType==='DELETE'){data.devices=data.devices.filter(x=>x.id!==p.old.id)}else{upsert(data.devices,devFromRow(p.new));sortDevs()}
      refresh();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},p=>{
      if(p.eventType==='DELETE'){data.sales=data.sales.filter(x=>x.id!==p.old.id)}else{upsert(data.sales,saleFromRow(p.new));sortSales()}
      refresh();
    })
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){if(linkLost){linkLost=false;loadAll().then(refresh).catch(()=>{})}}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){if(!linkLost){linkLost=true;if(page==='ozet')refresh()}}
    });
}
async function enter(){
  me=String(session&&session.user&&session.user.email||'').toLowerCase();
  stage='loading';render();
  try{
    const {data:row,error}=await sb.from('members').select('email').eq('email',me).maybeSingle();
    if(error)throw error;
    if(!row){stage='notmember';render();return}
    await loadAll();
    stage='ready';render();live();loadMembers();
  }catch(e){stage='error';render()}
}
function leave(){if(channel){sb.removeChannel(channel);channel=null}data={devices:[],sales:[]};members=[];me='';page='ozet';stage='auth';authMsg='';render()}
let lastRefetch=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&stage==='ready'&&Date.now()-lastRefetch>15000){lastRefetch=Date.now();loadAll().then(refresh).catch(()=>{})}
});

async function doAuth(email,pass){
  email=email.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){authMsg='Geçerli bir e-posta girin.';render();return}
  if(pass.length<6){authMsg='Şifre en az 6 karakter olmalı.';render();return}
  authBusy=true;authMsg='';render();
  try{
    if(authTab==='up'){
      const {data:r,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;
      if(r.session){session=r.session}
      else{authTab='in';authMsg='Hesap oluşturuldu. <b>'+esc(email)+'</b> adresine gelen onay bağlantısına dokunun (açılan sayfa hata verirse önemli değil), sonra buradan giriş yapın.'}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    const m=String(e&&e.message||'');
    authMsg=/Invalid login/i.test(m)?'E-posta veya şifre hatalı.':/not confirmed/i.test(m)?'E-postanız henüz onaylanmamış. Gelen kutunuzdaki (ve gereksiz klasöründeki) onay bağlantısına dokunun.':/already registered/i.test(m)?'Bu e-postayla zaten hesap var, Giriş yap sekmesini kullanın.':/rate limit/i.test(m)?'Çok fazla deneme yapıldı. Biraz bekleyip tekrar deneyin.':/fetch|network/i.test(m)?'İnternet bağlantısı yok.':'İşlem yapılamadı: '+esc(m);
  }
  authBusy=false;if(stage==='auth')render();
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
  if(e.target.classList.contains('modal-bg')&&!e.target.classList.contains('ask-bg')){closeModal();return}
  const b=e.target.closest('button');if(!b||b.closest('#ask'))return;
  const d=b.dataset;
  if(d.authtab){authTab=d.authtab;authMsg='';render();return}
  if(d.retry!==undefined){if(session)enter();else boot();return}
  if(d.logout!==undefined){await sb.auth.signOut();return}
  if(stage!=='ready')return;
  if(d.page){page=d.page;render();window.scrollTo(0,0);if(page==='ayar')loadMembers();return}
  if(d.new!==undefined){openDevice();return}
  if(d.close!==undefined){closeModal();return}
  if(d.filter!==undefined){query=d.filter;page='stok';render();window.scrollTo(0,0);return}
  if(d.tipclose!==undefined){lsSet(LKEY+'_tip','1');render();return}
  if(d.sell){const x=data.devices.find(v=>v.id===d.sell);if(x)openSell(x);return}
  if(d.edit){const x=data.devices.find(v=>v.id===d.edit);if(x)openDevice(x);return}
  if(d.del){
    const x=data.devices.find(v=>v.id===d.del);if(!x)return;
    if(await ask(nm(x)+' ('+sub(x)+(x.imei?', IMEI '+x.imei:'')+') stoktan silinsin mi?\nSattıysanız bunun yerine “Sattık” düğmesini kullanın.',{ok:'Sil',danger:true})){if(await store.delDevice(x.id))toast('Telefon silindi')}
    return;
  }
  if(d.return){
    const s=data.sales.find(x=>x.id===d.return);if(!s||s.status==='iade')return;
    if(!await ask(s.name+' satışı ('+fmt(s.total)+') iade alınsın mı?\nTelefon stoğa geri eklenir.',{ok:'İade al',danger:true}))return;
    if(!await store.putSale({...s,status:'iade',returnedAt:nowIso()}))return;
    for(let i=0;i<(s.qty||1);i++){
      const keepId=i===0&&s.deviceId&&!data.devices.some(v=>v.id===s.deviceId);
      await store.putDevice(normDev({id:keepId?s.deviceId:uid(),brand:s.brand,model:s.model||s.name,storage:s.storage,color:s.color,imei:i===0?s.imei:'',cost:s.cost,price:s.listPrice||s.price,addedAt:nowIso()}));
    }
    toast('İade alındı, telefon stoğa geri eklendi');return;
  }
  if(d.paid){
    const s=data.sales.find(x=>x.id===d.paid);if(!s)return;
    if(await ask((s.customer||'Müşteri')+' · '+fmt(s.total)+' tahsil edildi olarak işaretlensin mi?',{ok:'Tahsil edildi'})){if(await store.putSale({...s,paid:true,paidAt:nowIso()}))toast('Tahsilat kaydedildi')}
    return;
  }
  if(d.rmember){
    if(!await ask(d.rmember+' dükkândan çıkarılsın mı? Bu kişi artık kayıtları göremez.',{ok:'Çıkar',danger:true}))return;
    if(await run(sb.from('members').delete().eq('email',d.rmember))){toast('Çalışan çıkarıldı');loadMembers()}
    return;
  }
  if(d.export!==undefined){if(await download('mobil-dukkan-yedek-'+stamp()+'.json',JSON.stringify({v:2,devices:data.devices,sales:data.sales},null,1),'application/json')){lsSet(LKEY+'_lastBackup',nowIso());render();toast(isIOS?'Yedeği “Dosyalar’a Kaydet” ile saklayın':'Yedek indirildi')}return}
  if(d.csv!==undefined){if(!data.sales.length){toast('Dışa aktarılacak satış yok.');return}download('satislar-'+stamp()+'.csv',csvText(),'text/csv;charset=utf-8');return}
  if(d.reset!==undefined){
    if(!await ask('TÜM telefon ve satış kayıtları herkes için kalıcı olarak silinecek. Bu işlem geri alınamaz.',{ok:'Hepsini sil',danger:true}))return;
    if(await store.replaceAll({devices:[],sales:[]})){page='ozet';render();toast('Tüm veriler silindi')}
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='authForm'){e.preventDefault();if(!authBusy)doAuth(el('authEmail').value,el('authPass').value);return}
  if(e.target.id==='memberForm'){
    e.preventDefault();
    const email=el('memberEmail').value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){toast('Geçerli bir e-posta girin.');return}
    if(members.some(m=>m.email===email)){toast('Bu e-posta zaten ekli.');return}
    if(await run(sb.from('members').insert({email}))){el('memberEmail').value='';toast('Eklendi. Çalışan aynı e-postayla hesap oluşturabilir.');loadMembers()}
  }
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(askDone){askDone(false);return}if(el('modal').innerHTML)closeModal()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){query=t.value;const l=filteredDevices();el('devBody').innerHTML=devRows(l);el('devCount').textContent=devCount(l);return}
  if(t.id==='saleSearch'){saleQuery=t.value;const l=filteredSales();el('salesList').innerHTML=salesTable(l);el('salesSum').textContent=salesSum(l)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='imeiImage'&&t.files&&t.files[0]){const f=t.files[0];t.value='';readImei(f);return}
  if(t.id==='importFile'&&t.files&&t.files[0]){
    const file=t.files[0];t.value='';
    let d;try{d=JSON.parse(await file.text())}catch{d=null}
    if(!valid(d)){toast('Bu dosya geçerli bir yedek değil.');return}
    const next=migrate(d);
    if(!await ask('Mevcut kayıtlar silinip yedekteki '+next.devices.length+' telefon ve '+next.sales.length+' satış yüklenecek. Devam edilsin mi?',{ok:'Yedeği yükle',danger:true}))return;
    toast('Yedek yükleniyor…');
    toast(await store.replaceAll(next)?'Yedek geri yüklendi':'Yedeğin bir kısmı yüklenemedi. Tekrar deneyin.');
  }
});

/* ---------- Açılış ---------- */
async function boot(){
  stage='boot';render();
  if(!window.supabase||!window.supabase.createClient){stage='error';render();return}
  if(!sb){
    sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sb.auth.onAuthStateChange((ev,s)=>{
      const prev=session&&session.user&&session.user.id;session=s;
      if(ev==='SIGNED_OUT'||!s){leave();return}
      if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&prev!==s.user.id)setTimeout(enter,0);
    });
  }
  const {data:r,error}=await sb.auth.getSession();
  if(error){stage='auth';render();return}
  if(!r.session){stage='auth';render()}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
boot();
})();
</script>
</body></html>
